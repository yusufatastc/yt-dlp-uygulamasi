name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk YtKlip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YtKlip-apk
          path: YtKlip.apk

      - name: Publish as release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" YtKlip.apk \
            --title "YtKlip build ${{ github.run_number }}" \
            --notes "Debug APK. Telefonda indirip kur."
